[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "word-sifter"
version = "0.1.0"

dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "pydantic",
    "flask",
    "nltk",
    "loguru>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.ty.environment]
python = ".devenv/state/venv"
